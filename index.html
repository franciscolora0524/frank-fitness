<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Frank Fitness</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,sans-serif}main{max-width:720px;margin:auto;padding:16px}h1{font-size:1.6rem;margin:.2em 0}.sub{color:#8b949e}.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}.big{font-size:1.8rem;font-weight:700}.lbl{color:#8b949e;font-size:.85rem}.bar{background:#30363d;border-radius:99px;height:14px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#f97316,#22c55e);width:0}.ok{color:#22c55e}.warn{color:#f59e0b}.bad{color:#ef4444}.motto{font-size:1.1rem;font-style:italic;color:#fbbf24}ul{list-style:none;padding:0;margin:0}li{padding:8px 0;border-bottom:1px solid #30363d}li:last-child{border:0}small{color:#8b949e}</style></head><body><main>
<h1>Frank's Fitness Dashboard 💪</h1><div class="sub" id="upd">Loading…</div>
<div class="card"><div class="motto" id="motto"></div></div>
<div class="card"><div class="lbl">Progress to 185 lbs</div><div class="big" id="wt">–</div><div class="bar"><div id="pbar"></div></div><div class="sub" id="lost" style="margin-top:6px"></div></div>
<div class="card"><canvas id="chart" height="180"></canvas></div>
<div class="grid"><div class="card"><div class="lbl">Avg calories (this week)</div><div class="big" id="cal">–</div><small>Target 2,200–2,300</small></div>
<div class="card"><div class="lbl">Avg protein (this week)</div><div class="big" id="pro">–</div><small>Target 180–200g</small></div>
<div class="card"><div class="lbl">Workouts this week</div><div class="big" id="wo">–</div></div>
<div class="card"><div class="lbl">Snack-free nights (week)</div><div class="big" id="sf">–</div><small id="streak"></small></div>
<div class="card"><div class="lbl">Last bedtime</div><div class="big" id="bed">–</div><small id="beddate"></small></div>
<div class="card"><div class="lbl">Logged days (week)</div><div class="big" id="days">–</div></div></div>
<div class="card"><div class="lbl">Recent food</div><ul id="food"></ul></div>
<div class="card"><div class="lbl">Recent workouts</div><ul id="train"></ul></div>
</main><script>
const ID="1uY91U8yYdA8Y1Aa6C9TGkOU-JBgJroCmRShQVkjORwg",START=201,GOAL=185;
const url=t=>`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(t)}&_=${Date.now()}`;
function csv(s){const r=[];let row=[],f="",q=false;for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c=='"'){if(s[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=""}else if(c=='\n'){row.push(f);r.push(row);row=[];f=""}else if(c!='\r')f+=c}if(f||row.length){row.push(f);r.push(row)}const h=r.shift()||[];return r.map(x=>{const o={};h.forEach((k,j)=>{if(k)o[k.trim()]=(x[j]||"").trim()});return o}).filter(o=>Object.values(o).some(v=>v))}
async function get(t){try{const r=await fetch(url(t));return csv(await r.text())}catch(e){return[]}}
function pd(s){if(!s)return null;let m=s.match(/Date\((\d+),(\d+),(\d+)/);if(m)return new Date(+m[1],+m[2],+m[3]);m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return new Date(+m[3],m[1]-1,+m[2]);m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],m[2]-1,+m[3]);const d=new Date(s);return isNaN(d)?null:d}
function ft(s){if(!s)return"–";s=s.trim();let h,mi;let m=s.match(/Date\(\d+,\d+,\d+,(\d+),(\d+)/);if(m){h=+m[1];mi=+m[2]}else if(/^0?\.\d+$|^0$/.test(s)){const t=Math.round(parseFloat(s)*1440);h=Math.floor(t/60)%24;mi=t%60}else if(m=s.match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?/)){h=+m[1];mi=+m[2];if(m[3]){const p=m[3].toUpperCase();if(p=="PM"&&h<12)h+=12;if(p=="AM"&&h==12)h=0}}else return s;const ap=h>=12?"PM":"AM";const hh=h%12||12;return`${hh}:${String(mi).padStart(2,"0")} ${ap}`}
const fd=d=>d?d.toLocaleDateString("en-US",{weekday:"short",month:"numeric",day:"numeric"}):"";
const num=v=>{const n=parseFloat(String(v).replace(/,/g,""));return isNaN(n)?0:n};
const now=new Date();const ws=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7));const inWk=d=>d&&d>=ws;
const MOTTOS=["Discipline is choosing what you want most over what you want now.","Every rep, every meal, every early night — it's all for the family you're building.","You don't have to be extreme, just consistent.","185 is coming. One good day at a time.","The kitchen closes at 10:30. Champions close it on time.","Small wins stack. Stack another one today."];
document.getElementById("motto").textContent="“"+MOTTOS[Math.floor(now/864e5)%MOTTOS.length]+"”";
(async()=>{const[food,tr,hab,wi]=await Promise.all(["Food Log","Training Log","Daily Habits","Weigh-ins"].map(get));
const W=wi.map(r=>({d:pd(r["Date"]),w:num(r["Weight (lbs)"])})).filter(r=>r.d&&r.w).sort((a,b)=>a.d-b.d);
const cur=W.length?W[W.length-1].w:START,lost=START-cur,left=Math.max(0,cur-GOAL),pct=Math.min(100,Math.max(0,lost/(START-GOAL)*100));
wt.textContent=cur+" lbs";pbar.style.width=pct+"%";document.getElementById("lost").textContent=`${lost.toFixed(1)} lbs lost · ${left.toFixed(1)} lbs to go · ${pct.toFixed(0)}%`;
new Chart(chart,{type:"line",data:{labels:W.map(r=>fd(r.d)),datasets:[{label:"Weight",data:W.map(r=>r.w),borderColor:"#f97316",backgroundColor:"#f97316",tension:.3},{label:"Goal 185",data:W.map(()=>GOAL),borderColor:"#22c55e",borderDash:[6,6],pointRadius:0}]},options:{plugins:{legend:{labels:{color:"#e6edf3"}}},scales:{x:{ticks:{color:"#8b949e"},grid:{color:"#21262d"}},y:{suggestedMin:180,suggestedMax:205,ticks:{color:"#8b949e"},grid:{color:"#21262d"}}}}});
const byDay={};food.forEach(r=>{const d=pd(r["Date"]);if(!inWk(d))return;const k=d.toDateString();byDay[k]=byDay[k]||{c:0,p:0};byDay[k].c+=num(r["Est. Calories"]);byDay[k].p+=num(r["Est. Protein (g)"])});
const ds=Object.values(byDay),n=ds.length;days.textContent=n;
if(n){const c=ds.reduce((a,b)=>a+b.c,0)/n,p=ds.reduce((a,b)=>a+b.p,0)/n;cal.textContent=Math.round(c).toLocaleString();cal.className="big "+(c<=2300?"ok":c<=2600?"warn":"bad");pro.textContent=Math.round(p)+"g";pro.className="big "+(p>=180?"ok":p>=140?"warn":"bad")}
wo.textContent=tr.filter(r=>inWk(pd(r["Date"]))).length;
const H=hab.map(r=>({d:pd(r["Date"]),b:r["Bed time"],s:(r["Late snack (Y/N)"]||"").toUpperCase()})).filter(r=>r.d).sort((a,b)=>a.d-b.d);
sf.textContent=H.filter(r=>inWk(r.d)&&r.s.startsWith("N")).length;let st=0;for(let i=H.length-1;i>=0&&H[i].s.startsWith("N");i--)st++;streak.textContent=`Streak: ${st} night${st==1?"":"s"} 🔥`;
if(H.length){const l=H[H.length-1];bed.textContent=ft(l.b);beddate.textContent="Night of "+fd(l.d)}
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const F=food.map(r=>({...r,_d:pd(r["Date"])})).sort((a,b)=>b._d-a._d).slice(0,8);
document.getElementById("food").innerHTML=F.map(r=>`<li><b>${esc(r["Meal"]||"")}</b> · ${esc(r["Description"]||"")}<br><small>${fd(r._d)} ${ft(r["Time"])} · ${num(r["Est. Calories"])} cal · ${num(r["Est. Protein (g)"])}g protein</small></li>`).join("")||"<li>No food logged yet</li>";
const T=tr.map(r=>({...r,_d:pd(r["Date"])})).sort((a,b)=>b._d-a._d).slice(0,6);
train.innerHTML=T.map(r=>`<li><b>${esc(r["Type"]||"")}</b> · ${esc(r["Duration (min)"]||"")} min<br><small>${fd(r._d)} · ${esc(r["Workout details"]||"")}</small></li>`).join("")||"<li>No workouts yet</li>";
upd.textContent="Live from your log · updated "+now.toLocaleString("en-US",{weekday:"short",hour:"numeric",minute:"2-digit"});})();
</script></body></html>
